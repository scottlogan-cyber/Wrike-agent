name: Golden set eval

on:
  pull_request:
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run eval -w agent
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
